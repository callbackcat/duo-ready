schema_version: "1.1"
name: uikit-scan-and-fix
expected_outcome: |
  The response runs preflight first and names the host limitation, runs detect and scan on examples/uikit-broken, presents findings grouped by rule id with severity and autofix availability, shows the dry-run diff before any autofix is applied, asks before creating the duo-ready branch or applying fixes, explains the iOS 26 / 27.0 / 27.1 SDK tiers, and lists the stages that could not run on this host without claiming they ran.
