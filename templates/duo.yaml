# duo.yaml - duo-ready configuration. Generated by scripts/detect.py, owned by you.
# Format: references/pipeline-contracts.md. Commit this file.

stack: uikit                   # uikit | swiftui | mixed | react-native | expo | flutter | capacitor
scheme: MyApp
bundle_id: com.example.myapp
workspace: MyApp.xcworkspace   # or: project: MyApp.xcodeproj (delete the one you don't use)

# Cells are <pose>-<orientation>. "book" is the partially folded pose (hinge ~127 deg).
# split-view-left/right cannot be scripted yet and are captured in the open pose.
cells: [closed-portrait, closed-landscape, open-landscape, open-portrait, book-landscape, book-portrait]

# Pose changes executed while a flow is active (a fold can resize the app mid-session).
transitions: ["closed>open", "open>book", "open>closed"]

# Short navigation scripts that reach a screen worth checking. 2-5 is plenty.
# Grammar in templates/flows.yaml.
flows:
  - name: onboarding
    steps: [launch, tap "Get started", wait "Welcome"]
  - name: feed
    steps: [launch, wait "Feed", scroll 5]

assert:
  offscreen_elements: fail        # element bounds outside the window minus safe area
  clipped_text: fail              # truncated text with room to grow
  tap_target_min: 44              # points
  bars_vertical_expected: warn    # vertical bars expected in closed-* and open-landscape (27.1 SDK)
  content_under_outer_camera: fail
  interactive_in_fold: fail       # interactive element intersects the fold region in book-* cells
  visual_diff_threshold: 0.02     # fraction of differing pixels vs .duo/baselines

perf:
  mode: regression                # regression (vs .duo/baselines/perf.json) | absolute (thresholds below)
  launch_ms:        { warn: 800,  fail: 1500 }
  fold_relayout_ms: { fail: 250 }
  memory_delta_mb:  { warn: 30 }

loop:
  max_iterations: 3               # agent fix/rerun cycles before DUO-TODO.md is written

assets:
  locales: [en-US]
  output: fastlane/screenshots
